<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাসা-খোঁজ ও ইমার্জেন্সি সেবা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-10">

    <!-- TOP DOWNLOAD BANNER -->
    <a href="https://drive.google.com/uc?export=download&id=1VjTgAHx_IcjSVqaoFKeu9DE1fdn602XC" target="_blank" class="bg-emerald-800 text-white py-2 px-4 flex items-center gap-2 text-sm font-semibold shadow hover:bg-emerald-900 transition">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <span>অ্যাপ ডাউনলোড</span>
    </a>

    <!-- HEADER & AREA SELECTOR -->
    <div class="bg-white p-4 border-b border-slate-200 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🏠</span>
                <h1 class="text-lg font-bold text-emerald-800">বাসা-খোঁজ ও ইমার্জেন্সি</h1>
            </div>
            <select class="bg-slate-100 text-slate-700 text-xs rounded-lg px-2 py-1.5 border border-slate-300 font-medium outline-none">
                <option value="">📍 সব এলাকা</option>
                <option value="uttara">উত্তরা</option>
                <option value="mirpur">মিরপুর</option>
                <option value="dhanmondi">ধানমন্ডি</option>
                <option value="gulshan">গুলশান</option>
            </select>
        </div>

        <!-- SEARCH INPUT -->
        <div class="max-w-md mx-auto mb-3">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                <input type="text" placeholder="বাসা বা ইমার্জেন্সি সেবা খুঁজুন..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-sm outline-none focus:border-emerald-600">
            </div>
        </div>

        <!-- TABS / NAVIGATION BUTTONS -->
        <div class="max-w-md mx-auto flex gap-2 text-xs font-bold">
            <button class="flex-1 bg-emerald-700 text-white py-2 px-2 rounded-lg flex items-center justify-center gap-1 shadow-sm">
                🚨 ইমার্জেন্সি সেবা
            </button>
            <button class="flex-1 bg-white border border-slate-200 text-slate-700 py-2 px-2 rounded-lg flex items-center justify-center gap-1 shadow-sm hover:bg-slate-50">
                🏠 বাসা ও মেস ভাড়া
            </button>
            <button class="flex-1 bg-white border border-slate-200 text-slate-700 py-2 px-2 rounded-lg flex items-center justify-center gap-1 shadow-sm hover:bg-slate-50">
                ➕ পোস্ট করুন
            </button>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 mt-4">

        <!-- SOS BANNER -->
        <div class="bg-red-50 border border-red-100 rounded-2xl p-6 text-center shadow-sm mb-5">
            <div class="w-24 h-24 bg-red-600 text-white font-black text-2xl rounded-full flex flex-col items-center justify-center mx-auto mb-3 shadow-lg border-4 border-red-100 cursor-pointer active:scale-95 transition">
                <span class="text-xs tracking-widest opacity-80">SOS</span>
                <span>SOS</span>
            </div>
            <p class="text-xs text-red-700 font-semibold mb-4 leading-relaxed">
                বিপদে চাপ দিন — আপনার লোকেশনসহ বার্তা পাঠান প্রিয়জনদের কাছে
            </p>
            <a href="tel:999" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 px-6 rounded-xl inline-flex items-center gap-2 shadow text-sm transition">
                <i class="fa-solid fa-phone"></i>
                <span>জাতীয় জরুরি সেবা ৯৯৯</span>
            </a>
        </div>

        <!-- SERVICES GRID -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center cursor-pointer hover:shadow transition">
                <div class="text-3xl mb-2">🏥</div>
                <h3 class="font-bold text-xs text-slate-800">হাসপাতাল ও আইসিইউ</h3>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center cursor-pointer hover:shadow transition">
                <div class="text-3xl mb-2">🚑</div>
                <h3 class="font-bold text-xs text-slate-800">অ্যাম্বুলেন্স সেবা</h3>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center cursor-pointer hover:shadow transition">
                <div class="text-3xl mb-2">🩸</div>
                <h3 class="font-bold text-xs text-slate-800">রক্তদাতা ডিরেক্টরি</h3>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center cursor-pointer hover:shadow transition">
                <div class="text-3xl mb-2">🚓</div>
                <h3 class="font-bold text-xs text-slate-800">নিকটস্থ থানা</h3>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center cursor-pointer hover:shadow transition">
                <div class="text-3xl mb-2">🚒</div>
                <h3 class="font-bold text-xs text-slate-800">ফায়ার সার্ভিস</h3>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-center cursor-pointer hover:shadow transition">
                <div class="text-3xl mb-2">🐍</div>
                <h3 class="font-bold text-xs text-slate-800">অ্যান্টিভেনম ও বিশেষ সেবা</h3>
            </div>
        </div>

    </div>

</body>
</html>
